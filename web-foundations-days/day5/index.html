<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - User Directory</title>
  <!-- Load users.js with defer -->
  <script src="users.js" defer></script>
</head>
<body>
  <h1>User Directory</h1>

  <!-- Button to trigger fetch -->
  <button id="load-users">Load Users</button>

  <!-- Filter Input with Label -->
  <div>
    <label for="filter-input">Filter by name:</label>
    <input type="text" id="filter-input" placeholder="Type a name...">
  </div>

  <!-- Status Paragraph -->
  <p id="status"></p>

  <!-- Empty Users List -->
  <ul id="users-list"></ul>
</body>
</html>
